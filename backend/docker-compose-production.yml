version: '3.8'

# Production configuration for 2M users with horizontal scaling
# Use with: docker-compose -f docker-compose-production.yml up -d
# Scale services: docker-compose -f docker-compose-production.yml up -d --scale core-banking=5 --scale api-gateway=3

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ventureroot
      POSTGRES_USER: ventureroot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — refusing to start with a default production password}
      POSTGRES_INITDB_ARGS: "-c shared_buffers=4GB -c effective_cache_size=12GB -c work_mem=10MB -c maintenance_work_mem=1GB"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ventureroot -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  redis:
    image: redis:7-alpine
    command: >
      redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru --loglevel warning
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set — refusing to start an unauthenticated production Redis}
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2.5G
        reservations:
          cpus: '1'
          memory: 1.5G

  core-banking:
    build:
      context: ./services/core-banking
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: '1'
      LOG_LEVEL: info
      WORKERS: '4'
      # Overrides the plain (unauthenticated) REDIS_URL in .env.production —
      # env_file values aren't interpolated, so the password has to be
      # injected here where compose-level ${} substitution actually runs.
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: '3'
          memory: 1.5G
        reservations:
          cpus: '2'
          memory: 1G

  ai-ml-service:
    build:
      context: ./services/ai-ml-service
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: '1'
      LOG_LEVEL: info
      WORKERS: '2'
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - backend
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '4'
          memory: 3G
        reservations:
          cpus: '2.5'
          memory: 2G

  rag-service:
    build:
      context: ./services/rag-service
      dockerfile: Dockerfile
      args:
        INSTALL_RAG_OPTIONAL: "false"
    environment:
      PYTHONUNBUFFERED: '1'
      LOG_LEVEL: info
      WORKERS: '2'
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8003"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '3'
          memory: 2G
        reservations:
          cpus: '2'
          memory: 1.5G

  ussd-service:
    build:
      context: ./services/ussd-service
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: '1'
      LOG_LEVEL: info
      WORKERS: '4'
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8004"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1.5'
          memory: 512M

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: '1'
      LOG_LEVEL: info
      WORKERS: '8'
      FORWARDED_ALLOW_IPS: '*'
      # Overrides the plain (unauthenticated) REDIS_URL in .env.production —
      # env_file values aren't interpolated, so the password has to be
      # injected here where compose-level ${} substitution actually runs.
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    env_file:
      - .env.production
    depends_on:
      core-banking:
        condition: service_healthy
      ai-ml-service:
        condition: service_healthy
      rag-service:
        condition: service_healthy
      ussd-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8000"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '3'
          memory: 1.5G
        reservations:
          cpus: '2'
          memory: 1G

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  backend:
    driver: bridge
