version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENV: production
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      API_SECRET_KEY: ${API_SECRET_KEY}
    volumes:
      - ./app:/app/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: PostgreSQL for local development
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ventureroot
      POSTGRES_USER: ventureroot
      POSTGRES_PASSWORD: ventureroot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
