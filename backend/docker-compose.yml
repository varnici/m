version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ventureroot
      POSTGRES_USER: ventureroot
      POSTGRES_PASSWORD: ventureroot
    ports:
      - "5433:5432"  # Host 5433 maps to Container 5432
    volumes:
      - vr_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  core-banking:
    build:
      context: ./services/core-banking
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8001:8001"

  ai-ml-service:
    build:
      context: ./services/ai-ml-service
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8002:8002"

  rag-service:
    build:
      context: ./services/rag-service
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8003:8003"

  ussd-service:
    build:
      context: ./services/ussd-service
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8004:8004"

  api-gateway:
    build:
      context: ./services/api-gateway
    env_file:
      - .env
    depends_on:
      - core-banking
      - ai-ml-service
      - rag-service
      - ussd-service
    ports:
      - "8080:8000" # Gateway accessible on 8080

volumes:
  vr_postgres_data: